spring:
  application:
    name: klickit-backend
  main:
    allow-circular-references: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/klickit}
    username: ${DB_USERNAME:klickit}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
    show-sql: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: true
            required: true
        transport:
          protocol: smtp

klickit:
  admin:
    email: ${ADMIN_EMAIL}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION:86400000}
  otp:
    enabled: ${OTP_ENABLED:true}
    secret: ${OTP_SECRET:}
    ttl-minutes: ${OTP_TTL_MINUTES:5}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
    max-requests-per-hour: ${OTP_MAX_REQUESTS_PER_HOUR:5}
    dev-log-code: ${OTP_DEV_LOG_CODE:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080}
  cart:
    retention-days: ${CART_RETENTION_DAYS:30}
    cleanup-cron: ${CART_CLEANUP_CRON:0 0 3 * * ?}
  mail:
    api-key: ${MAIL_API_KEY:}
    from: ${MAIL_FROM:onboarding@resend.dev}
    api-url: ${MAIL_API_URL:https://api.resend.com/emails}
    timezone: ${MAIL_TIMEZONE:Asia/Kolkata}
  bootstrap:
    admin:
      name: ${BOOTSTRAP_ADMIN_NAME:KlickIt Admin}
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      phone: ${BOOTSTRAP_ADMIN_PHONE:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  seed:
    demo-products: ${SEED_DEMO_PRODUCTS:false}
  delivery:
    fee: ${DELIVERY_FEE:25.00}
    free-threshold: ${DELIVERY_FREE_THRESHOLD:199.00}
    store:
      latitude: ${DELIVERY_STORE_LAT:23.073427650432762}
      longitude: ${DELIVERY_STORE_LON:76.82864818972119}
      max-radius-km: ${DELIVERY_MAX_RADIUS_KM:6.0}
    campus:
      gate-latitude: ${DELIVERY_CAMPUS_GATE_LAT:23.075611}
      gate-longitude: ${DELIVERY_CAMPUS_GATE_LON:76.850082}
      radius-m: ${DELIVERY_CAMPUS_RADIUS_M:1100.0}
    enforce-range: ${DELIVERY_ENFORCE_RANGE:true}
  routing:
    enabled: ${KLICKIT_ROUTING_ENABLED:${ROUTING_ENABLED:true}}
    provider: ${ROUTING_PROVIDER:openrouteservice}
    base-url: ${ROUTING_BASE_URL:https://api.openrouteservice.org}
    api-key: ${KLICKIT_ROUTING_API_KEY:}
    connect-timeout-ms: ${ROUTING_CONNECT_TIMEOUT_MS:3000}
    request-timeout-ms: ${ROUTING_REQUEST_TIMEOUT_MS:3000}
    max-distance-meters: ${ROUTING_MAX_DISTANCE_METERS:5000}

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

logging:
  level:
    com.klickit: INFO
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
