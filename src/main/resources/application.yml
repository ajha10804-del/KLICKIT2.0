spring:
  application:
    name: klickit-backend
  main:
    allow-circular-references: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/klickit}
    username: ${DB_USERNAME:klickit}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
    show-sql: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: true
            required: true
        transport:
          protocol: smtp

klickit:
  admin:
    email: ${ADMIN_EMAIL}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  mail:
    api-key: ${MAIL_API_KEY:}
    from: ${MAIL_FROM:onboarding@resend.dev}
    api-url: ${MAIL_API_URL:https://api.resend.com/emails}
    timezone: ${MAIL_TIMEZONE:Asia/Kolkata}
  bootstrap:
    admin:
      name: ${BOOTSTRAP_ADMIN_NAME:KlickIt Admin}
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      phone: ${BOOTSTRAP_ADMIN_PHONE:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  seed:
    demo-products: ${SEED_DEMO_PRODUCTS:false}
  delivery:
    fee: ${DELIVERY_FEE:25.00}
    free-threshold: ${DELIVERY_FREE_THRESHOLD:199.00}

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

logging:
  level:
    com.klickit: INFO
    org.hibernate.SQL: WARN

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
