# =============================================================================
# KLICKIT Production Configuration Profile (spring.profiles.active=prod)
# Strictly requires explicit cloud environment variables.
# Silent localhost fallbacks for database and CORS origins are disallowed.
# =============================================================================
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

klickit:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  jwt:
    secret: ${JWT_SECRET}
  otp:
    secret: ${OTP_SECRET}
    dev-log-code: false
  mail:
    api-key: ${MAIL_API_KEY}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
